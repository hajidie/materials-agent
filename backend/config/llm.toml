schema_version = 1
default_model = "deepseek_default"

[models.deepseek_default]
provider = "deepseek"
name = "deepseek-flash"
context_window_tokens = 1000000

[models.deepseek_default.capabilities]
supported_parameters = ["temperature", "top_p", "max_tokens"]
reasoning_modes = ["disabled", "enabled"]
reasoning_efforts = ["low", "high", "max"]
supports_thinking_budget = false
structured_output_reasoning_modes = ["disabled", "enabled"]
supports_sampling_with_reasoning = false
requires_streaming_for_reasoning = false
supports_tool_calling = true

[models.qwen_default]
provider = "qwen"
name = "qwen3.8-flash"
context_window_tokens = 1000000

[models.qwen_default.capabilities]
supported_parameters = ["temperature", "top_p", "top_k", "max_tokens"]
reasoning_modes = ["disabled", "enabled"]
reasoning_efforts = ["low", "medium", "high", "xhigh", "max"]
supports_thinking_budget = true
structured_output_reasoning_modes = ["disabled"]
supports_sampling_with_reasoning = true
requires_streaming_for_reasoning = true
supports_tool_calling = true

[defaults]
timeout_seconds = 60

[roles.agent_decision]
temperature = 0.0
max_tokens = 1024
reasoning_mode = "disabled"
prompt_limit_tokens = 16384
history_token_budget = 8192
safety_margin_tokens = 1024

[roles.tool_arg_resolution]
temperature = 0.0
max_tokens = 1024
reasoning_mode = "disabled"
prompt_limit_tokens = 8192
history_token_budget = 4096
safety_margin_tokens = 1024

[roles.final_answer]
temperature = 0.0
max_tokens = 768
reasoning_mode = "disabled"
prompt_limit_tokens = 8192
history_token_budget = 0
safety_margin_tokens = 1024
