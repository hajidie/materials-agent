[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "materialsagent-backend"
version = "0.1.0"
description = "Local materials agent backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.2",
  "minio==7.2.20",
  "numpy==2.4.6",
  "Pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "psycopg[binary]==3.3.4",
  "SQLAlchemy==2.0.51",
  "urllib3==2.7.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["materialsagent*"]
namespaces = true
