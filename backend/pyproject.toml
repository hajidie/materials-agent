[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "materialsagent-backend"
version = "0.1.0"
description = "Local materials agent backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "langchain==1.4.2",
  "langchain-core==1.6.5",
  "langchain-deepseek==1.1.0",
  "langchain-openai==1.3.5",
  "langgraph==1.2.12",
  "langgraph-checkpoint-postgres==3.1.2",
  "minio==7.2.20",
  "numpy==2.4.6",
  "openai==2.46.0",
  "Pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.3",
  "SQLAlchemy==2.0.51",
  "tiktoken==0.13.0",
  "urllib3==2.7.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
mcp = ["mcp==1.30.0", "sse-starlette==3.0.3"]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["materialsagent*"]
namespaces = true

[tool.setuptools.package-data]
"materialsagent.application" = ["materials_ml_contracts.json"]
