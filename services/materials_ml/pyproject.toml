[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-ml"
version = "0.1.0"
description = "Independent numeric tabular regression engine"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.3.3",
  "pandas==2.3.3",
  "scipy==1.16.2",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "build==1.3.0", "setuptools==80.9.0"]
service = [
  "materials-storage==0.1.0", "fastapi==0.116.1", "uvicorn==0.35.0",
  "pydantic==2.11.9", "pydantic-settings==2.10.1", "python-multipart==0.0.20",
  "SQLAlchemy==2.0.43", "psycopg[binary]==3.2.10", "alembic==1.16.5",
  "minio==7.2.16", "httpx==0.28.1",
]
worker = ["httpx==0.28.1"]
mcp = ["mcp==1.30.0", "sse-starlette==3.0.3"]

[project.scripts]
materials-ml-service = "materials_ml_service.api:main"
materials-ml-worker = "materials_ml_service.worker:main"
materials-ml-admin = "materials_ml_service.admin:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["materials_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
